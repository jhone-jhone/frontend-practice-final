<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维展示 · 校园公共信息与数据展示中心</title>
  <script src="libs/aframe.min.js"></script>
  <style>
    /* 置于 A-Frame 全屏画布之上的返回按钮 */
    .back-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      display: inline-block;
      padding: 8px 14px;
      background: #0d6efd;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }
    .back-link:hover { background: #0b5ed7; color: #fff; }

    /* 场景说明文字，避免遮挡三维画面 */
    .scene-tip {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      margin: 0;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 6px;
      color: #495057;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html">← 返回信息中心</a>
  <p class="scene-tip">鼠标拖拽旋转视角、滚轮缩放（移动端单指拖动旋转）</p>

  <!-- 木牌贴图：A-Frame 默认字体不含中文字形，故用 canvas 绘制木牌后作为纹理 -->
  <a-assets>
    <img id="wood-sign" alt="好好学习，天天向上">
  </a-assets>

  <script>
    (function () {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const g = canvas.getContext('2d');

      // 木质底色（竖向渐变）
      const bg = g.createLinearGradient(0, 0, 0, 512);
      bg.addColorStop(0, '#d8b078');
      bg.addColorStop(0.5, '#c69452');
      bg.addColorStop(1, '#a97b3f');
      g.fillStyle = bg;
      g.fillRect(0, 0, 1024, 512);

      // 木纹
      g.strokeStyle = 'rgba(120, 80, 40, 0.16)';
      g.lineWidth = 2;
      for (let i = 0; i < 26; i++) {
        const y = 10 + i * 20;
        g.beginPath();
        g.moveTo(0, y);
        g.bezierCurveTo(320, y + 7, 700, y - 7, 1024, y + 3);
        g.stroke();
      }

      // 深色内边框
      g.strokeStyle = 'rgba(92, 58, 26, 0.8)';
      g.lineWidth = 9;
      g.strokeRect(26, 26, 1024 - 52, 512 - 52);

      // 牌面文字：先描浅色错位高光，再压深色正文，形成刻字效果
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = 'bold 128px "Microsoft YaHei", "SimHei", sans-serif';
      g.fillStyle = 'rgba(255, 246, 224, 0.6)';
      g.fillText('好好学习', 515, 163);
      g.fillText('天天向上', 515, 355);
      g.fillStyle = '#4a2c14';
      g.fillText('好好学习', 512, 160);
      g.fillText('天天向上', 512, 352);

      document.querySelector('#wood-sign').src = canvas.toDataURL('image/png');
    })();
  </script>

  <a-scene>
    <a-sky color="#aee3f7"></a-sky>
    <a-plane
      position="0 0 -4" rotation="-90 0 0"
      width="20" height="20" color="#7cb342">
    </a-plane>
    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>
    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
    <a-box
      position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
      animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
    </a-box>
    <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
    <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
    </a-sphere>

    <!-- ★ 树：树干 + 三层树冠 -->
    <a-cylinder position="4.5 0.9 -4" radius="0.15" height="1.8" color="#6d4c41"></a-cylinder>
    <a-cone     position="4.5 2.4 -4" radius-top="0.05" radius-bottom="1.1" height="2.2" color="#43a047"></a-cone>
    <a-cone     position="4.5 3.3 -4" radius-top="0.05" radius-bottom="0.85" height="1.8" color="#66bb6a"></a-cone>
    <a-cone     position="4.5 4.1 -4" radius-top="0.05" radius-bottom="0.55" height="1.4" color="#81c784"></a-cone>

    <!-- ★ 木牌：两根立柱 + 牌身 + 牌面文字贴图 -->
    <a-cylinder position="-2.72 0.7 -3.5" radius="0.07" height="1.4" color="#7b5230"></a-cylinder>
    <a-cylinder position="-1.08 0.7 -3.5" radius="0.07" height="1.4" color="#7b5230"></a-cylinder>
    <a-box position="-1.9 1.95 -3.5" width="2.0" height="1.1" depth="0.08" color="#8a5a2b"></a-box>
    <a-plane
      position="-1.9 1.95 -3.455" width="1.9" height="0.95"
      material="src: #wood-sign">
    </a-plane>

    <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-camera position="0 1.8 2"></a-camera>
  </a-scene>
</body>
</html>
