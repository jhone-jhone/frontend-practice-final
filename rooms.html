<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 · 校园公共信息与数据展示中心</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4 sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="rooms.html">自习室查询</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#stats">使用统计</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/campus.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 class="h3">自习室查询</h1>
    <p class="text-muted small">按楼栋、楼层、状态筛选，支持名称/楼栋关键词搜索。</p>
    <p id="rooms-alert" class="alert alert-warning" role="alert" style="display:none"></p>

    <div class="row g-2 mb-3">
      <div class="col-6 col-md-auto">
        <label for="building-filter" class="form-label">楼栋</label>
        <select id="building-filter" class="form-select">
          <option value="all">全部</option>
        </select>
      </div>
      <div class="col-6 col-md-auto">
        <label for="floor-filter" class="form-label">楼层</label>
        <select id="floor-filter" class="form-select">
          <option value="all">全部</option>
          <option value="1">1层</option>
          <option value="2">2层</option>
          <option value="3">3层</option>
          <option value="4">4层</option>
        </select>
      </div>
      <div class="col-6 col-md-auto">
        <label for="status-filter" class="form-label">状态</label>
        <select id="status-filter" class="form-select">
          <option value="all">全部</option>
          <option value="开放">开放</option>
          <option value="闭馆">闭馆</option>
          <option value="维修">维修</option>
        </select>
      </div>
      <div class="col-12 col-md">
        <label for="search-input" class="form-label">搜索（名称/楼栋）</label>
        <div class="input-group">
          <input id="search-input" type="text" class="form-control" placeholder="如：图书馆" aria-label="搜索关键词">
          <button id="clear-search" class="btn btn-outline-secondary" type="button">清除</button>
        </div>
      </div>
    </div>

    <p class="text-muted small" id="room-count"></p>
    <ul id="room-list" class="list-group"></ul>
  </main>

  <footer class="text-center text-muted py-4">
    软件开发综合实践 · 期末大作业 · 数据来源：课程统一数据集
  </footer>

  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="rooms.js"></script>
</body>
</html>
